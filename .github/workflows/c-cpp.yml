name: C/C++ CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install GHOST
      run: git clone https://github.com/richoux/GHOST.git && cd GHOST && ./build.sh
    - name: make
      run: make
    - name: test
      run: ./test_all.sh
